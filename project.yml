name: ProxyMonitor
options:
  bundleIdPrefix: com.xushuda
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ProxyMonitor:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ProxyTrafficMonitor
    info:
      path: ProxyTrafficMonitor/App/Info.plist
      properties:
        CFBundleDisplayName: ProxyMonitor
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSUserNotificationUsageDescription: "Traffic and expiry reminders"
    entitlements:
      path: ProxyTrafficMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xushuda.proxymonitor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
